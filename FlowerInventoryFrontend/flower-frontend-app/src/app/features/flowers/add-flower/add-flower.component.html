
<div class="container">
    <h1 class="mt-3">Add Flower</h1>

    <form #form="ngForm" (ngSubmit)="onFormSubmit()">
        <div class="mt-2">
            <div class="mt-3">
                <label class="form-label">Flower Name</label>
                <input type="text" id="flowerName" class="form-control" 
                name="flowerName" [(ngModel)]="model.name">
            </div>

            <div class="mt-3">
                <label class="form-label">Price</label>
                <input type="number" step="0.01" id="price" class="form-control" name="price" [(ngModel)]="model.price">
            </div>

            <div class="mt-3">
                <label class="form-label">Category</label>
                <select class="form-select" [(ngModel)]="model.categoryId" name="categoryId">
                  <option value="">-- Select Category --</option>
                  <option *ngFor="let category of categories" [value]="category.categoryId">
                    {{ category.categoryName }}
                  </option>
                </select>
              </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </div>
    </form>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toastMessage" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">Flower created successfully!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>
